<nav aria-label="Menú principal">
  @for (section of sections(); track section.label) {
    <div class="nav-section">
      <button
        class="nav-section-toggle"
        type="button"
        (click)="toggle(section.label)"
        [attr.aria-expanded]="section.expanded"
      >
        <span>{{ section.label }}</span>
        <svg
          class="chevron"
          [class.chevron--open]="section.expanded"
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>

      @if (section.expanded) {
        <ul role="list" class="nav-tree">
          @for (item of section.items; track item.label) {
            <li class="nav-tree-item">
              @if (item.disabled) {
                <span class="nav-link nav-link--disabled">{{ item.label }}</span>
              } @else {
                <a
                  [routerLink]="item.route"
                  routerLinkActive="active"
                  class="nav-link"
                  [attr.aria-current]="null"
                >
                  {{ item.label }}
                </a>
              }
            </li>
          }
        </ul>
      }
    </div>
  }
</nav>

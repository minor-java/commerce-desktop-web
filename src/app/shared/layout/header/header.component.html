<header role="banner">
  <div class="header-start">
    <button
      type="button"
      class="menu-btn"
      (click)="toggleSidebar.emit()"
      aria-label="Alternar menú lateral"
    >
      <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true" focusable="false">
        <rect y="2" width="18" height="2" rx="1"/>
        <rect y="8" width="18" height="2" rx="1"/>
        <rect y="14" width="18" height="2" rx="1"/>
      </svg>
    </button>

    <a routerLink="/" class="brand" aria-label="Ir al inicio">
      @if (tema.logoUrl(); as logo) {
        <img [src]="logo" class="brand-logo" alt="" width="92" height="52" />
      } @else {
        <span class="brand-logo brand-logo--neutral" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5 4.5 4h15L21 9.5"/>
            <path d="M3 9.5a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/>
            <path d="M5 12.3V20h14v-7.7"/>
            <path d="M10 20v-4.5h4V20"/>
          </svg>
        </span>
      }
    </a>
  </div>

  <div class="header-end">
    @if (auth.session(); as session) {
      <div class="user-info" aria-label="Usuario actual">
        <span class="user-avatar" aria-hidden="true">{{ (session.nombre || session.usuario)[0].toUpperCase() }}</span>
        <div class="user-meta">
          <span class="user-name">{{ session.nombre || session.usuario }}</span>
          <span
            class="role-badge"
            [class.role-badge--cajero]="!session.superUsuario && session.rol !== 'ADMIN'"
            [class.role-badge--super]="session.superUsuario"
          >
            {{ session.rol }}
          </span>
        </div>
      </div>

      <a
        routerLink="/cambiar-contrasena"
        class="header-btn"
        aria-label="Cambiar contraseña"
        title="Cambiar contraseña"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="7.5" cy="15.5" r="4.5"/>
          <path d="M10.7 12.3 21 2"/>
          <path d="m16 7 3 3"/>
          <path d="m19 4 2 2"/>
        </svg>
      </a>

      <button
        type="button"
        class="logout-btn"
        (click)="auth.logout()"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    }
  </div>
</header>

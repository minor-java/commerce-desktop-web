<div class="backdrop" (click)="onCerrar()" role="dialog" aria-modal="true" [attr.aria-label]="'Códigos de barras de ' + combo().nombre">
  <div class="dialog" (click)="$event.stopPropagation()">

    <div class="dialog-header">
      <h2 class="dialog-title">Códigos de barras — {{ combo().nombre }}</h2>
      <button type="button" class="dialog-close" (click)="onCerrar()" aria-label="Cerrar">✕</button>
    </div>

    <div class="dialog-body">
      <app-codigos-barras-print-list [codigos]="combo().codigosBarras" [nombre]="combo().nombre" />
    </div>

    <div class="dialog-footer">
      <button type="button" class="btn-cancel" (click)="onCerrar()">Cerrar</button>
    </div>

  </div>
</div>
